services:
  postgres-test:
    image: postgres:17

    container_name: oralsync-postgres-test

    restart: unless-stopped

    environment:
      POSTGRES_DB: odontoclinica_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres-test-data:/var/lib/postgresql/data

volumes:
  postgres-test-data: