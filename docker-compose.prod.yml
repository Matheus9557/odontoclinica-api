
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: oralsync-api

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3000:3000"

    depends_on:
      - postgres

    networks:
      - oralsync-network

  postgres:
    image: postgres:16-alpine

    container_name: oralsync-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: odontoclinica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - oralsync-network

volumes:
  postgres-data:

networks:
  oralsync-network: